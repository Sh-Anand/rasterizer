[package]
name = "rasterizer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
glam = "0.33"
gltf = { version = "1.4.1", features = ["extensions"] }
image = { version = "0.25", default-features = false, features = ["png"] }
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
