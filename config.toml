width = 1024
height = 768
# Per-axis supersampling: 1 = off, 2 = 4 samples/pixel, 4 = 16 samples/pixel.
supersampling = 1
# Material texture filtering: "none" (nearest texel of the nearest mip level), "bilinear"
# (level zero), or "trilinear".
sampling = "trilinear"
# Ray-traced, cosine-weighted diffuse bounce (CUDA only); build with BOUNCE_RAYS=n for n rays
# per pixel (default 4).
bounce = true

[output]
# Linear brightness multiplier; 2.0 is one stop brighter.
exposure = 1.0
tone_mapping = true

[camera]
position = [3.0, 2.0, 3.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov_y_degrees = 60.0
near = 0.1
far = 1000.0

