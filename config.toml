width = 800
height = 600
# Material texture filtering: "none" (nearest), "bilinear", or "trilinear".
sampling = "trilinear"

[output]
# Linear brightness multiplier; 2.0 is one stop brighter.
exposure = 1.0
tone_mapping = true

[camera]
position = [3.0, 2.0, 3.0]
target = [0.0, 0.0, 0.0]
up = [0.0, 1.0, 0.0]
fov_y_degrees = 60.0
near = 0.1
far = 1000.0

[scene_cameras.living-room]
position = [4.7, 1.4, -2.6]
target = [1.8, 1.0, -1.6]
up = [0.0, 1.0, 0.0]
fov_y_degrees = 60.0
near = 0.1
far = 1000.0

[light]
# World-space direction toward the light.
direction = [1.0, 3.0, 2.0]
# Linear RGB and a brightness multiplier.
color = [1.0, 1.0, 1.0]
intensity = 1.0

[shadow]
enabled = true
resolution = 1024
# Constant bias in normalized depth; slope bias is automatic.
bias = 0.0001

[bake]
# Approximate atlas resolution; chart padding can increase the actual size.
resolution = 32
hemicube_resolution = 16
# Surface offset as a fraction of the scene's diagonal.
bias = 0.00001
